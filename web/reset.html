<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen - TypingNinja</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="bg-animation"></div>

<div class="screen">
    <div class="glass-panel auth-panel">
        <h1>Neues Passwort</h1>
        <div class="auth-box">
            <p style="margin-bottom: 20px; font-size: 0.9rem;">Bitte gib hier dein neues Passwort ein.</p>
            <input type="password" id="new-pw" placeholder="Neues Passwort" class="modern-input">
            <button id="save-btn" class="primary-btn full-width">Passwort speichern</button>
            <p id="status-msg" class="error-text" style="margin-top: 15px; font-weight: bold;"></p>

            <a href="index.html" class="text-link" style="margin-top: 20px;">Zurück zum Login</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('save-btn').addEventListener('click', async () => {
        // Token aus der URL-Leiste auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const newPassword = document.getElementById('new-pw').value;
        const statusMsg = document.getElementById('status-msg');

        if (!token) {
            statusMsg.style.color = '#fca5a5';
            statusMsg.textContent = 'Fehler: Kein Token in der URL gefunden.';
            return;
        }
        if (newPassword.length < 3) {
            statusMsg.style.color = '#fca5a5';
            statusMsg.textContent = 'Das Passwort ist zu kurz.';
            return;
        }

        const res = await fetch('backend.php?action=reset_password', {
            method: 'POST',
            body: JSON.stringify({ token: token, new_password: newPassword })
        });
        const data = await res.json();

        if (data.success) {
            statusMsg.style.color = '#10b981'; // Grün
            statusMsg.textContent = 'Passwort erfolgreich geändert! Du kannst dich nun einloggen.';
            document.getElementById('new-pw').value = '';
        } else {
            statusMsg.style.color = '#fca5a5'; // Rot
            statusMsg.textContent = data.message;
        }
    });
</script>
</body>
</html>
