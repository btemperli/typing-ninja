<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrpersonen-Portal - TypingNinja</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .admin-nav button { background: transparent; color: white; padding: 10px; font-weight: normal; border: 1px solid transparent; }
        .admin-nav button.active { font-weight: 800; border-bottom: 2px solid var(--primary); }
        .admin-nav button:hover { background: rgba(255,255,255,0.1); }
        .admin-tab { display: none; }
        .admin-tab.active { display: block; }
    </style>
</head>
<body>
<div class="bg-animation"></div>

<div id="admin-auth-screen" class="screen">
    <div class="glass-panel auth-panel">
        <h1>Lehrpersonen</h1>
        <input type="password" id="admin-pw" placeholder="Admin Passwort" class="modern-input">
        <button id="admin-login-btn" class="primary-btn full-width">Einloggen</button>
        <p id="admin-error" class="error-text"></p>
        <a href="index.html" class="text-link">Zurück zum Spiel</a>
    </div>
</div>

<div id="admin-dashboard" class="screen" style="display: none; align-items: flex-start; padding-top: 50px;">
    <div class="glass-panel wide-panel" style="max-height: 90vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Admin Dashboard</h2>
            <a href="index.html" class="secondary-btn" style="text-decoration: none;">Zum Spiel</a>
        </div>

        <nav class="admin-nav">
            <button id="tab-btn-scores" class="active">Spielresultate</button>
            <button id="tab-btn-users">Benutzerverwaltung (Passwort Reset)</button>
        </nav>

        <!-- Tab 1: Resultate -->
        <div id="tab-scores" class="admin-tab active">
            <div class="table-responsive">
                <table class="modern-table" style="font-size: 0.9rem;">
                    <thead>
                    <tr><th>Zeitstempel</th><th>User</th><th>Lektion</th><th>Modus</th><th>Punkte</th><th>SPM</th><th>APM</th><th>Fehler</th><th>Dauer (s)</th><th>Aktion</th></tr>                    </thead>
                    <tbody id="scores-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab 2: Benutzerverwaltung -->
        <div id="tab-users" class="admin-tab">
            <div class="table-responsive">
                <table class="modern-table">
                    <thead>
                    <tr><th>Username</th><th>Email</th><th>Aktion</th></tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let cachedPw = '';

    document.getElementById('admin-login-btn').addEventListener('click', async (e) => {
        const btn = e.target;
        const pw = document.getElementById('admin-pw').value;

        btn.classList.add('btn-loading');
        document.getElementById('admin-error').textContent = '';

        try {
            const res = await fetch('backend.php?action=admin_login', { method: 'POST', body: JSON.stringify({password: pw}) });
            const data = await res.json();

            if (data.success) {
                cachedPw = pw;
                document.getElementById('admin-auth-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'flex';
                renderScores(data.scores);
                loadUsers();
            } else {
                document.getElementById('admin-error').textContent = 'Falsches Passwort!';
            }
        } catch (err) {
            document.getElementById('admin-error').textContent = 'Netzwerkfehler.';
        } finally {
            btn.classList.remove('btn-loading');
        }
    });

    // Tab-Steuerung
    document.getElementById('tab-btn-scores').addEventListener('click', () => switchTab('scores'));
    document.getElementById('tab-btn-users').addEventListener('click', () => switchTab('users'));

    function switchTab(tabName) {
        document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-btn-${tabName}`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function renderScores(scores) {
        const tbody = document.getElementById('scores-tbody');
        tbody.innerHTML = '';
        scores.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${s.date}</td><td>${s.username}</td><td>${s.lesson}</td><td>${s.mode}</td><td>${s.score}</td><td>${s.spm}</td><td>${s.apm}</td><td>${s.errors}</td><td>${s.time}</td>`;

            const tdAction = document.createElement('td');
            const btn = document.createElement('button');
            btn.className = 'danger-btn';
            btn.style.padding = '4px 10px';
            btn.style.fontSize = '0.85rem';
            btn.textContent = 'Loeschen';
            btn.onclick = () => deleteScore(s.id, tr);

            tdAction.appendChild(btn);
            tr.appendChild(tdAction);
            tbody.appendChild(tr);
        });
    }

    async function deleteScore(scoreId, rowElement) {
        if (!confirm('Diesen Eintrag wirklich loeschen?')) return;

        try {
            const res = await fetch('backend.php?action=admin_delete_score', {
                method: 'POST',
                body: JSON.stringify({ password: cachedPw, score_id: scoreId })
            });
            const data = await res.json();
            if (data.success) {
                rowElement.remove(); // Zeile direkt aus der Tabelle entfernen ohne Neuladen
            } else {
                alert('Fehler beim Loeschen: ' + (data.message || 'Unbekannt'));
            }
        } catch (err) {
            alert('Netzwerkfehler.');
        }
    }

    async function loadUsers() {
        const res = await fetch('backend.php?action=admin_get_users', { method: 'POST', body: JSON.stringify({password: cachedPw}) });
        const data = await res.json();
        if (data.success) {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';
            data.users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${u.username}</td><td>${u.email}</td>`;

                const tdAction = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'primary-btn';
                btn.style.padding = '5px 10px';
                btn.textContent = 'Passwort-Reset Link erstellen';
                btn.onclick = () => generateResetLink(u.email);

                tdAction.appendChild(btn);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });
        }
    }

    async function generateResetLink(email) {
        const res = await fetch('backend.php?action=admin_generate_reset', {
            method: 'POST',
            body: JSON.stringify({password: cachedPw, user_email: email})
        });
        const data = await res.json();
        if (data.success) {
            // Zeigt ein Prompt-Fenster, aus dem der Lehrer den Link kopieren kann
            window.prompt('Link für den Schüler kopieren:', data.link);
        } else {
            alert('Fehler beim Erstellen des Links.');
        }
    }
</script>
</body>
</html>
